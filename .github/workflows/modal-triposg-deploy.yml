name: Deploy Modal TripoSG

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit containing the TripoSG integration
        required: true
        default: consolidation/runtime-snapshots-20260925
        type: string
  push:
    branches:
      - main
    paths:
      - ".modal-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: modal-triposg-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      MODAL_TOKEN_SET_COMMAND: ${{ secrets.MODAL_TOKEN_SET_COMMAND }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'consolidation/runtime-snapshots-20260925' }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse Modal credentials and derive provider token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_SET_COMMAND"
          python - <<'PY'
          import base64, hashlib, hmac, os, shlex
          parts=shlex.split(os.environ["MODAL_TOKEN_SET_COMMAND"])
          def arg(name):
              for i,p in enumerate(parts):
                  if p==name and i+1<len(parts):
                      return parts[i+1]
                  if p.startswith(name+"="):
                      return p.split("=",1)[1]
              raise SystemExit("missing "+name)
          token_id=arg("--token-id")
          token_secret=arg("--token-secret")
          if not token_id.startswith("ak-") or not token_secret.startswith("as-"):
              raise SystemExit("invalid Modal API token format")
          shared=base64.urlsafe_b64encode(
              hmac.new(
                  token_secret.encode(),
                  ("makersence-modal-shared-v1:"+token_id).encode(),
                  hashlib.sha256,
              ).digest()
          ).decode().rstrip("=")
          print("::add-mask::"+token_id)
          print("::add-mask::"+token_secret)
          print("::add-mask::"+shared)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write("MODAL_TOKEN_ID="+token_id+"\n")
              fh.write("MODAL_TOKEN_SECRET="+token_secret+"\n")
              fh.write("MAKERSENCE_MODAL_SHARED_TOKEN="+shared+"\n")
          PY

      - name: Install Modal
        run: python -m pip install "modal>=1.5,<2" requests

      - name: Validate provider source
        run: |
          python -m py_compile makersence-cad-worker/integrations/modal_triposg/app.py
          grep -F 'TRIPOSG_SOURCE_COMMIT = "fc5c40990181e2a756c4e0b1c2f4d6b5202faf8c"' makersence-cad-worker/integrations/modal_triposg/app.py
          grep -F 'gpu="T4"' makersence-cad-worker/integrations/modal_triposg/app.py

      - name: Create or update provider shared secret
        shell: bash
        run: |
          set -euo pipefail
          modal secret create makersence-triposg-shared \
            "MAKERSENCE_MODAL_SHARED_TOKEN=$MAKERSENCE_MODAL_SHARED_TOKEN" \
            --force

      - name: Deploy TripoSG provider
        run: |
          modal deploy makersence-cad-worker/integrations/modal_triposg/app.py \
            --name makersence-triposg \
            --strategy rolling

      - name: Smoke test health
        shell: bash
        env:
          MODAL_TRIPOSG_ENDPOINT: https://zhbettychien--makersence-triposg-api.modal.run
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ["MODAL_TRIPOSG_ENDPOINT"].rstrip("/")+"/health"
          with urllib.request.urlopen(url, timeout=120) as r:
              body=json.load(r)
              if r.status != 200:
                  raise SystemExit(f"health status={r.status}")
          required={
              "ok": True,
              "provider": "modal_triposg",
              "contract_version": "makersence-design-model-v1",
              "output_format": "glb",
          }
          for k,v in required.items():
              if body.get(k) != v:
                  raise SystemExit(f"health mismatch {k}={body.get(k)!r}")
          print("MODAL_TRIPOSG_HEALTH_OK", json.dumps(body, sort_keys=True))
          PY

      - name: Smoke test real image to GLB
        shell: bash
        env:
          MODAL_TRIPOSG_ENDPOINT: https://zhbettychien--makersence-triposg-api.modal.run
          SOURCE_IMAGE_URL: https://raw.githubusercontent.com/VAST-AI-Research/TripoSG/fc5c40990181e2a756c4e0b1c2f4d6b5202faf8c/assets/example_data/qwvfsd.png
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct
          import requests
          endpoint=os.environ["MODAL_TRIPOSG_ENDPOINT"].rstrip("/")+"/generate"
          payload={
              "contract_version":"makersence-design-model-v1",
              "provider":"modal_triposg",
              "mode":"image_to_3d",
              "source_image_url":os.environ["SOURCE_IMAGE_URL"],
              "target_faces":2000,
              "output_format":"glb",
          }
          try:
              r=requests.post(
                  endpoint,
                  json=payload,
                  headers={
                      "Authorization":"Bearer "+os.environ["MAKERSENCE_MODAL_SHARED_TOKEN"],
                  },
                  timeout=2100,
                  allow_redirects=True,
              )
          except requests.RequestException as exc:
              raise SystemExit(f"generate request failed: {exc}")
          if r.status_code != 200:
              body=r.text[:4000]
              raise SystemExit(f"generate HTTP {r.status_code}: {body}")
          data=r.content[:64_000_001]
          status=r.status_code
          ctype=(r.headers.get("Content-Type") or "").split(";",1)[0].lower()
          expected_sha=r.headers.get("X-MakerSence-Artifact-Sha256") or ""
          if status != 200:
              raise SystemExit(f"generate status={status}")
          if ctype != "model/gltf-binary":
              raise SystemExit(f"unexpected content-type={ctype}")
          if len(data) < 20 or data[:4] != b"glTF":
              raise SystemExit("invalid GLB magic/length")
          magic, version, declared_len=struct.unpack("<4sII", data[:12])
          if magic != b"glTF" or version != 2 or declared_len != len(data):
              raise SystemExit(f"invalid GLB header version={version} declared={declared_len} actual={len(data)}")
          actual_sha=hashlib.sha256(data).hexdigest()
          if expected_sha and expected_sha != actual_sha:
              raise SystemExit("GLB sha256 header mismatch")
          open("/tmp/triposg-smoke.glb","wb").write(data)
          print("MODAL_TRIPOSG_GENERATE_OK", json.dumps({
              "bytes":len(data),
              "sha256":actual_sha,
              "glb_version":version,
              "target_faces":payload["target_faces"],
          }, sort_keys=True))
          PY
