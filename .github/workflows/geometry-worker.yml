name: MakerSence free geometry runner

on:
  pull_request:
    paths:
      - ".github/workflows/geometry-worker.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/geometry-worker.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: makersence-free-geometry-runner
  cancel-in-progress: false

jobs:
  validate-workflow:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/geometry-worker.yml", aliases: true); puts "Workflow YAML parsed."'
      - name: Check out pinned Heavy Worker source
        uses: actions/checkout@v4
        with:
          ref: 6c3d8801e7118cd42d58468adc939820af953cd1
          path: worker
      - name: Build pinned Heavy Worker container
        run: docker build --pull -f worker/makersence-cad-worker/runtime/heavy/Dockerfile -t makersence-heavy-geometry worker/makersence-cad-worker/runtime/heavy
      - name: Verify pinned alignment child entry point
        run: |
          docker run --rm --entrypoint python makersence-heavy-geometry -c 'from pathlib import Path; p=Path("/app/app.py").read_text(); assert "--counterpart-alignment-child" in p and "counterpart-alignment-v4-exact-mesh-gap-bounded" in p and "alignment_result.json" in p; print("Pinned Heavy Worker alignment child is present.")'

  run-one-geometry-task:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Claim one geometry task from the Hub over GitHub OIDC
        id: claim
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const hub = 'https://makersence.hatchable.site';
          const audience = hub + '/api/research/github-runner';
          function fail(code) { throw new Error(code); }
          async function getOidcToken() {
            const endpoint = String(process.env.ACTIONS_ID_TOKEN_REQUEST_URL || '');
            const requestToken = String(process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN || '');
            if (!endpoint || !requestToken) fail('OIDC_UNAVAILABLE');
            const url = new URL(endpoint);
            url.searchParams.set('audience', audience);
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + requestToken, Accept: 'application/json' },
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) fail('OIDC_REQUEST_FAILED');
            const token = String((await response.json()).value || '');
            if (!token) fail('OIDC_TOKEN_EMPTY');
            return token;
          }
          async function main() {
            const token = await getOidcToken();
            const response = await fetch(hub + '/api/research/github-runner-claim', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                run_id: String(process.env.RUN_ID || ''),
                run_attempt: Number(process.env.RUN_ATTEMPT || 0),
                sha: String(process.env.COMMIT_SHA || '')
              }),
              signal: AbortSignal.timeout(20000)
            });
            if (!String(response.headers.get('content-type') || '').toLowerCase().includes('application/json')) fail('WORKER_RESPONSE_NOT_JSON');
            const result = await response.json();
            if ((response.status === 202 && result.status === 'not_ready') ||
                (response.status === 503 && result.error === 'RUNNER_NOT_ENABLED')) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, ['claimed=false', ''].join(String.fromCharCode(10)));
              console.log(result.error === 'RUNNER_NOT_ENABLED'
                ? 'Runner is disabled; no task was claimed.'
                : 'No geometry task is waiting.');
              return;
            }
            if (!response.ok || !result.ok) fail('HUB_CLAIM_REJECTED');
            const taskId = String(result.task_id || '');
            const jobId = Number(result.job && result.job.id || 0);
            const request = result.request || {};
            if (!/^[a-f0-9]{32}$/.test(taskId)) fail('TASK_ID_INVALID');
            if (!Number.isInteger(jobId) || jobId <= 0) fail('HUB_JOB_ID_INVALID');
            for (const key of ['source_url', 'counterpart_url']) {
              const value = String(request[key] || '');
              if (!value.startsWith('https://') || value.length > 4096) fail('GEOMETRY_URL_INVALID');
            }
            if (!Number.isInteger(request.expected_instances) || request.expected_instances < 1 || request.expected_instances > 12) fail('EXPECTED_INSTANCES_INVALID');
            fs.writeFileSync('/tmp/makersence-alignment-request.json', JSON.stringify(request), { mode: 0o600 });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, ['claimed=true', 'task_id=' + taskId, 'job_id=' + jobId, ''].join(String.fromCharCode(10)));
            console.log('A signed geometry task was claimed; request details were withheld.');
          }
          main().catch(() => { console.error('Geometry task claim failed; request details were withheld.'); process.exitCode = 1; });
          NODE
      - name: Check out the pinned Heavy Worker source
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@v4
        with:
          ref: 6c3d8801e7118cd42d58468adc939820af953cd1
          path: worker

      - name: Build the Heavy Worker container
        if: steps.claim.outputs.claimed == 'true'
        run: docker build --pull -f worker/makersence-cad-worker/runtime/heavy/Dockerfile -t makersence-heavy-geometry worker/makersence-cad-worker/runtime/heavy

      - name: Start the isolated Heavy Worker
        if: steps.claim.outputs.claimed == 'true'
        run: |
          docker run -d --name makersence-heavy-geometry \
            -e WORKER_TOKEN=ephemeral-github-runner-token \
            -e PORT=8000 \
            -e MAKERSENCE_HEAVY_CONCURRENCY=1 \
            -p 18000:8000 \
            makersence-heavy-geometry

      - name: Wait for the Worker health check
        if: steps.claim.outputs.claimed == 'true'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(180):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18000/health",timeout=3) as r:
                      health=json.load(r)
                  if health.get("ok"):
                      print("Heavy Worker is ready.")
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Heavy Worker health check timed out.")
          PY

      - name: Run exact source and counterpart mesh alignment
        id: align
        if: steps.claim.outputs.claimed == 'true'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          base="http://127.0.0.1:18000"
          token="ephemeral-github-runner-token"
          try:
              request=json.load(open("/tmp/makersence-alignment-request.json",encoding="utf-8"))
              body=json.dumps(request,separators=(",",":")).encode("utf-8")
              submit=urllib.request.Request(base+"/v1/submit-counterpart-alignment",data=body,headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(submit,timeout=30) as r: submitted=json.load(r)
              job_id=str(submitted.get("job_id") or "")
              if not job_id: raise RuntimeError("worker did not return a job id")
              job=None
              for _ in range(900):
                  poll=urllib.request.Request(base+"/v1/counterpart-alignment-jobs/"+job_id,headers={"Authorization":"Bearer "+token})
                  with urllib.request.urlopen(poll,timeout=20) as r: job=json.load(r)
                  if job.get("status") in ("completed","failed"): break
                  time.sleep(2)
              if not job or job.get("status")!="completed": raise RuntimeError("geometry alignment did not complete")
              alignment=job.get("result")
              if not isinstance(alignment,dict): raise RuntimeError("geometry alignment result is missing")
              if alignment.get("algorithm_version")!="counterpart-alignment-v4-exact-mesh-gap-bounded": raise RuntimeError("geometry algorithm version mismatch")
              triangles=int((alignment.get("source") or {}).get("triangle_count") or 0)
              if triangles<=0: raise RuntimeError("full-resolution source mesh evidence is missing")
              if alignment.get("status") not in ("ALIGNED","REVIEW_REQUIRED"): raise RuntimeError("geometry alignment status is invalid")
              raw=json.dumps(alignment,separators=(",",":"),ensure_ascii=False).encode("utf-8")
              if len(raw)>800000: raise RuntimeError("geometry evidence exceeds the result limit")
              import os
              fd=os.open("/tmp/makersence-alignment-result.json",os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)
              with os.fdopen(fd,"wb") as f: f.write(raw)
              print(json.dumps({"geometry_status":alignment.get("status"),"source_triangle_count":triangles,"result_bytes":len(raw)}))
          except Exception:
              raise SystemExit("Full-resolution geometry alignment failed; raw worker details were withheld.")
          PY

      - name: Return the signed result to the Hub
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          TASK_ID: ${{ steps.claim.outputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          ALIGN_OUTCOME: ${{ steps.align.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const hub = 'https://makersence.hatchable.site';
          const audience = hub + '/api/research/github-runner';
          async function getOidcToken() {
            const endpoint = String(process.env.ACTIONS_ID_TOKEN_REQUEST_URL || '');
            const requestToken = String(process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN || '');
            if (!endpoint || !requestToken) throw new Error('OIDC_UNAVAILABLE');
            const url = new URL(endpoint);
            url.searchParams.set('audience', audience);
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + requestToken, Accept: 'application/json' },
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error('OIDC_REQUEST_FAILED');
            const token = String((await response.json()).value || '');
            if (!token) throw new Error('OIDC_TOKEN_EMPTY');
            return token;
          }
          async function main() {
            const success = process.env.ALIGN_OUTCOME === 'success';
            const payload = {
              task_id: String(process.env.TASK_ID || ''),
              run_id: String(process.env.RUN_ID || ''),
              run_attempt: Number(process.env.RUN_ATTEMPT || 0),
              sha: String(process.env.COMMIT_SHA || ''),
              status: success ? 'completed' : 'failed'
            };
            if (success) payload.alignment = JSON.parse(fs.readFileSync('/tmp/makersence-alignment-result.json', 'utf8'));
            else payload.failure_code = 'WORKER_FAILED';
            const body = JSON.stringify(payload);
            for (let attempt = 0; attempt < 12; attempt++) {
              const token = await getOidcToken();
              let response;
              try {
                response = await fetch(hub + '/api/research/github-runner-result', {
                  method: 'POST',
                  headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                  body,
                  signal: AbortSignal.timeout(15000)
                });
              } catch {
                await new Promise(resolve => setTimeout(resolve, 2000));
                continue;
              }
              let result = {};
              try { result = await response.json(); } catch {}
              if (response.status === 200 && result.ok) {
                console.log('Signed geometry result was accepted by the Hub.');
                return;
              }
              if (response.status === 202 || response.status === 409 || response.status >= 500) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                continue;
              }
              throw new Error('WORKER_RESULT_REJECTED');
            }
            throw new Error('WORKER_RESULT_DELIVERY_TIMEOUT');
          }
          main().catch(() => { console.error('Signed result delivery failed.'); process.exitCode = 1; });
          NODE
      - name: Remove temporary geometry data
        if: always()
        run: |
          docker rm -f makersence-heavy-geometry >/dev/null 2>&1 || true
          rm -f /tmp/makersence-alignment-request.json /tmp/makersence-alignment-result.json
