name: Signed precise geometry alignment

on:
  push:
    branches:
      - codex/github-runner-capacity-20260928
    paths:
      - "makersence-geometry-queue/*.json"
      - ".github/workflows/geometry-worker.yml"

permissions:
  contents: read

concurrency:
  group: makersence-precise-geometry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Identify opaque geometry task
        id: queue
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, sys
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8"))
          changed=set()
          for commit in event.get("commits") or []:
              changed.update(commit.get("added") or [])
              changed.update(commit.get("modified") or [])
          if not changed and event.get("head_commit"):
              changed.update(event["head_commit"].get("added") or [])
              changed.update(event["head_commit"].get("modified") or [])
          matches=sorted(p for p in changed if re.fullmatch(r"makersence-geometry-queue/[a-f0-9]{32}\.json",p))
          if not matches:
              with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:f.write("skip=true\n")
              print("No opaque geometry task was added; skipping.")
              sys.exit(0)
          if len(matches)!=1:
              raise SystemExit("Expected one opaque geometry task.")
          path=matches[0]
          try:
              queue=json.load(open(path,encoding="utf-8"))
              task=str(queue.get("task_id") or "")
          except Exception:
              raise SystemExit("Geometry task marker is invalid.")
          if queue.get("version")!=1 or not re.fullmatch(r"[a-f0-9]{32}",task) or path!="makersence-geometry-queue/"+task+".json":
              raise SystemExit("Geometry task marker is invalid.")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("skip=false\n")
              f.write("task_id="+task+"\n")
          print("Accepted one opaque geometry task ID.")

      - name: Claim geometry task from MakerSence Hub
        id: claim
        if: steps.queue.outputs.skip != 'true'
        env:
          MAKERSENCE_GEOMETRY_RUNNER_KEY: ${{ secrets.MAKERSENCE_GEOMETRY_RUNNER_KEY }}
          TASK_ID: ${{ steps.queue.outputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          function fail(message){throw new Error(message)}
          function signingKey(){
            const raw=String(process.env.MAKERSENCE_GEOMETRY_RUNNER_KEY||'').trim();
            if(!raw)fail('runner signing key unavailable');
            const master=/^[0-9a-f]{64}$/i.test(raw)?Buffer.from(raw,'hex'):Buffer.from(raw,'base64');
            if(master.length!==32)fail('runner signing key invalid');
            return crypto.createHmac('sha256',master).update('MAKERSENCE_GITHUB_GEOMETRY_HMAC_V1').digest().toString('hex');
          }
          async function main(){
            const task=String(process.env.TASK_ID||'');
            if(!/^[a-f0-9]{32}$/.test(task))fail('task identity invalid');
            const payload={task_id:task,run_id:String(process.env.RUN_ID||''),run_attempt:Number(process.env.RUN_ATTEMPT||0),sha:String(process.env.COMMIT_SHA||'')};
            const body=JSON.stringify(payload);
            const secret=signingKey();
            for(let attempt=0;attempt<180;attempt++){
              const timestamp=String(Math.floor(Date.now()/1000));
              const signature=crypto.createHmac('sha256',Buffer.from(secret,'utf8')).update(timestamp+'.'+body).digest('hex');
              let response;
              try{
                response=await fetch('https://makersence.hatchable.site/api/research/github-runner-claim',{
                  method:'POST',
                  headers:{'Content-Type':'application/json','X-MakerSence-Timestamp':timestamp,'X-MakerSence-Signature':signature},
                  body,
                  signal:AbortSignal.timeout(15000)
                });
              }catch{await sleep(1000);continue}
              if(response.status===200){
                const result=await response.json();
                const request=result.request||{};
                if(!result.ok||typeof request.source_url!=='string'||!request.source_url.startsWith('https://')||typeof request.counterpart_url!=='string'||!request.counterpart_url.startsWith('https://')||!Number.isInteger(request.expected_instances)||request.expected_instances<1||request.expected_instances>12)fail('Hub returned an invalid geometry request');
                fs.writeFileSync('/tmp/makersence-alignment-request.json',JSON.stringify(request),{mode:0o600});
                console.log('Signed Hub claim accepted; request details were not logged.');
                return;
              }
              if(response.status===202||response.status===409||response.status>=500){await sleep(1000);continue}
              fail('Hub claim rejected with HTTP '+response.status);
            }
            fail('Hub claim timed out.');
          }
          main().catch(()=>{console.error('Signed Hub claim failed.');process.exitCode=1});
          NODE
      - name: Build the full-resolution geometry worker
        if: steps.queue.outputs.skip != 'true'
        run: docker build --pull -t makersence-precise-alignment makersence-cad-worker/runtime/heavy

      - name: Start the isolated geometry worker
        if: steps.queue.outputs.skip != 'true'
        run: |
          docker run -d --name makersence-precise-alignment \
            -e WORKER_TOKEN=ephemeral-github-runner-token \
            -e PORT=8000 \
            -e MAKERSENCE_HEAVY_CONCURRENCY=1 \
            -p 18000:8000 \
            makersence-precise-alignment

      - name: Wait for the worker health check
        if: steps.queue.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          for _ in range(180):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18000/health",timeout=3) as r:
                      health=json.load(r)
                  if health.get("ok"):
                      print("Geometry worker is ready; version "+str(health.get("version") or "unknown"))
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Geometry worker health check timed out.")
          PY

      - name: Run exact source and counterpart mesh alignment
        id: align
        if: steps.queue.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error,os
          base="http://127.0.0.1:18000"
          token="ephemeral-github-runner-token"
          try:
              request=json.load(open("/tmp/makersence-alignment-request.json",encoding="utf-8"))
              body=json.dumps(request,separators=(",",":")).encode("utf-8")
              submit=urllib.request.Request(base+"/v1/submit-counterpart-alignment",data=body,headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(submit,timeout=30) as r: submitted=json.load(r)
              job_id=str(submitted.get("job_id") or "")
              if not job_id: raise RuntimeError("worker did not return a job id")
              job=None
              for _ in range(900):
                  poll=urllib.request.Request(base+"/v1/counterpart-alignment-jobs/"+job_id,headers={"Authorization":"Bearer "+token})
                  with urllib.request.urlopen(poll,timeout=20) as r: job=json.load(r)
                  if job.get("status") in ("completed","failed"): break
                  time.sleep(2)
              if not job or job.get("status")!="completed": raise RuntimeError("geometry alignment did not complete")
              alignment=job.get("result")
              if not isinstance(alignment,dict): raise RuntimeError("geometry alignment result is missing")
              if alignment.get("algorithm_version")!="counterpart-alignment-v4-exact-mesh-gap-bounded": raise RuntimeError("geometry algorithm version mismatch")
              triangles=int((alignment.get("source") or {}).get("triangle_count") or 0)
              if triangles<=0: raise RuntimeError("full-resolution source mesh evidence is missing")
              if alignment.get("status") not in ("ALIGNED","REVIEW_REQUIRED"): raise RuntimeError("geometry alignment status is invalid")
              raw=json.dumps(alignment,separators=(",",":"),ensure_ascii=False).encode("utf-8")
              if len(raw)>800000: raise RuntimeError("geometry evidence exceeds the encrypted result limit")
              with open("/tmp/makersence-alignment-result.json","wb") as f:f.write(raw)
              print(json.dumps({"status":"PASS","algorithm_version":alignment.get("algorithm_version"),"geometry_status":alignment.get("status"),"source_triangle_count":triangles,"result_bytes":len(raw)}))
          except Exception:
              raise SystemExit("Full-resolution geometry alignment failed; raw worker details were withheld.")
          PY

      - name: Return signed result to MakerSence Hub
        if: always() && steps.claim.outcome == 'success'
        env:
          MAKERSENCE_GEOMETRY_RUNNER_KEY: ${{ secrets.MAKERSENCE_GEOMETRY_RUNNER_KEY }}
          TASK_ID: ${{ steps.queue.outputs.task_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ALIGN_OUTCOME: ${{ steps.align.outcome }}
        run: |
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          function signingKey(){
            const raw=String(process.env.MAKERSENCE_GEOMETRY_RUNNER_KEY||'').trim();
            if(!raw)throw new Error('missing key');
            const master=/^[0-9a-f]{64}$/i.test(raw)?Buffer.from(raw,'hex'):Buffer.from(raw,'base64');
            if(master.length!==32)throw new Error('invalid key');
            return crypto.createHmac('sha256',master).update('MAKERSENCE_GITHUB_GEOMETRY_HMAC_V1').digest().toString('hex');
          }
          async function main(){
            const success=process.env.ALIGN_OUTCOME==='success';
            let payload={task_id:String(process.env.TASK_ID||''),run_id:String(process.env.RUN_ID||''),run_attempt:Number(process.env.RUN_ATTEMPT||0),status:success?'completed':'failed'};
            if(success){
              const result=JSON.parse(fs.readFileSync('/tmp/makersence-alignment-result.json','utf8'));
              payload.alignment=result;
            }else{
              payload.failure_code='WORKER_FAILED';
            }
            const body=JSON.stringify(payload);
            const secret=signingKey();
            for(let attempt=0;attempt<12;attempt++){
              const timestamp=String(Math.floor(Date.now()/1000));
              const signature=crypto.createHmac('sha256',Buffer.from(secret,'utf8')).update(timestamp+'.'+body).digest('hex');
              let response;
              try{
                response=await fetch('https://makersence.hatchable.site/api/research/github-runner-result',{
                  method:'POST',
                  headers:{'Content-Type':'application/json','X-MakerSence-Timestamp':timestamp,'X-MakerSence-Signature':signature},
                  body,
                  signal:AbortSignal.timeout(15000)
                });
              }catch{await sleep(2000);continue}
              if(response.status===200){
                console.log('Signed result accepted by MakerSence Hub.');
                return;
              }
              if(response.status===202||response.status===409||response.status>=500){await sleep(2000);continue}
              throw new Error('Hub result rejected with HTTP '+response.status);
            }
            throw new Error('Hub result delivery timed out.');
          }
          main().catch(()=>{console.error('Signed result delivery failed.');process.exitCode=1});
          NODE

      - name: Remove temporary geometry data
        if: always()
        run: |
          docker rm -f makersence-precise-alignment >/dev/null 2>&1 || true
          rm -f /tmp/makersence-alignment-request.json /tmp/makersence-alignment-result.json
