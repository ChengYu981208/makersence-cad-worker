name: Runtime Source Check

on:
  push:
    branches:
      - consolidation/runtime-snapshots-20260925
  pull_request:
    paths:
      - "makersence-cad-worker/runtime/**"
      - "makersence-cad-worker/app/**"

jobs:
  static-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: makersence-cad-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: |
          python -m py_compile runtime/heavy/app.py
          python -m py_compile runtime/heavy/design_model_router.py
          python -m py_compile runtime/cad-core-v5/app.py
          python -m py_compile runtime/slicer/app.py
          python -m compileall -q app
      - name: Slicer shell syntax
        run: bash -n runtime/slicer/start.sh
      - name: Design model router contract
        run: |
          python - <<'PY'
          import hashlib,os,sys
          sys.path.insert(0,"runtime/heavy")
          import design_model_router as router
          raw=b"glTF"+b"\x02\x00\x00\x00"+b"\x18\x00\x00\x00"+b"makerSence12"
          sha=hashlib.sha256(raw).hexdigest()
          class FakeResponse:
              status=200
              headers={
                  "Content-Type":"model/gltf-binary",
                  "X-MakerSence-Provider-Version":"triposg-contract-test",
                  "X-MakerSence-Artifact-Sha256":sha,
              }
              def __enter__(self): return self
              def __exit__(self,*args): return False
              def read(self,n=-1): return raw
          def fake_urlopen(req,timeout=None):
              assert req.full_url=="https://modal.example.com/generate"
              assert req.headers.get("Authorization")=="Bearer test-token"
              return FakeResponse()
          router.urlopen=fake_urlopen
          os.environ["MODAL_TRIPOSG_ENDPOINT"]="https://modal.example.com/generate"
          os.environ["MODAL_TRIPOSG_TOKEN"]="test-token"
          out=router.route_design_model({
              "provider":"modal_triposg",
              "mode":"image_to_3d",
              "source_image_url":"https://example.com/reference.png",
              "prompt":"product concept",
              "target_faces":5000,
              "output_format":"glb",
          })
          assert out["status"]=="PASS"
          assert out["artifact_bytes"]==raw
          assert out["artifact_sha256"]==sha
          assert out["content_type"]=="model/gltf-binary"
          assert out["provider"]=="modal_triposg"
          try:
              router.route_design_model({"provider":"unknown","source_image_url":"https://example.com/a.png"})
              raise AssertionError("unsupported provider did not fail closed")
          except router.DesignModelProviderError as exc:
              assert "DESIGN_MODEL_PROVIDER_UNSUPPORTED:unknown" in str(exc)
          print("DESIGN_MODEL_ROUTER_CONTRACT_PASS")
          PY
      - name: Runtime version markers
        run: |
          grep -F "2.61.0-design-model-router" runtime/heavy/app.py
          grep -F "2.13.0-08mm-typography" runtime/cad-core-v5/app.py
          grep -F "1.1.11" runtime/slicer/app.py
          grep -F "3.2.0-inkscape-svg" app/main.py
      - name: No source-chunk dependency in packaged runtimes
        run: |
          ! grep -R "WORKER_SRC_" runtime/heavy runtime/cad-core-v5
          ! grep -R "SLICER_SRC_" runtime/slicer
      - name: Generic runtime anti-regression
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[Path("runtime/heavy/app.py"),Path("runtime/cad-core-v5/app.py")]
          texts={str(p):p.read_text(encoding="utf-8") for p in paths}
          forbidden_global=[
              "music_photo_nfc_keepsake",
              "halloween_pumpkin",
              "pumpkin_autumn",
              "smooth_pumpkin_container_v2",
              "PHOTO_WINDOW",
              "PHOTO_RECESS",
              'family=str(c.get("family") or "rounded_plate")',
          ]
          forbidden_defs=[
              "def hybrid_bone_tag(",
              "def static_functional_utensil_vessel(",
              "def sculpted_lidded_container(",
              "def open_box(",
              "def phone_stand(",
          ]
          for name,text in texts.items():
              for token in forbidden_global+forbidden_defs:
                  assert token not in text, f"{name}: forbidden legacy specialization returned: {token}"
              assert "CAD_FAMILY_UNSUPPORTED_USE_UNIVERSAL_CAD_RECIPE" in text, f"{name}: fail-closed router missing"
              assert "svg_profile_extrusion" in text, f"{name}: generic SVG route missing"
              assert "formal_geometry_only_render_v1" in text, f"{name}: geometry-only render capability missing"
          print("GENERIC_RUNTIME_GUARDS_PASS")
          for name,text in texts.items():
              assert "TEXT_MIN_STROKE_DEFAULT=0.80" in text, f"{name}: text stroke floor must remain 0.8 mm"
              assert "TEXT_LATIN_GAP_DEFAULT=0.80" in text, f"{name}: Latin/digit gap must remain 0.8 mm"
              assert "TEXT_CJK_GAP_DEFAULT=0.80" in text, f"{name}: CJK gap must remain 0.8 mm"
              assert "TEXT_CJK_INTERNAL_GAP_DEFAULT=0.80" in text, f"{name}: CJK internal gap must remain 0.8 mm"
              assert '"MakerSenseTypography":"bambu_04_slicer_safe_v4_08mm"' in text, f"{name}: 3MF typography policy metadata is stale"
              assert '"MakerSenseTextMinStroke":"0.80"' in text, f"{name}: 3MF text stroke metadata is below baseline"
              assert '"line_width":"0.42"' in text, f"{name}: Bambu slicer line width must stay a process setting"
          print("TYPOGRAPHY_08MM_GUARDS_PASS")
          root=Path("app/main.py").read_text(encoding="utf-8")
          tooling=Path("app/tooling.py").read_text(encoding="utf-8")
          assert "inkscape_svg_normalize_v1" in root
          assert "svg_raster_reject_v1" in root
          assert "def normalize_svg_bytes(" in tooling
          assert "RASTER_IMAGE_FORBIDDEN" in tooling
          print("INKSCAPE_ADAPTER_SOURCE_GUARDS_PASS")
          heavy=Path("runtime/heavy/app.py").read_text(encoding="utf-8")
          assert "generic_blender_profile_executor_v1" in heavy
          assert "GENERIC_BLENDER_PROFILE_SCRIPT" in heavy
          assert "def generic_blender_profile(" in heavy
          assert "GENERIC_BLENDER_APPEARANCE_PROFILE_NOT_READY" in heavy
          assert "hybrid_bone_tag(" not in heavy
          print("GENERIC_BLENDER_SOURCE_GUARDS_PASS")
          router=Path("runtime/heavy/design_model_router.py").read_text(encoding="utf-8")
          assert 'SUPPORTED_PROVIDERS = {"modal_triposg"}' in router
          assert "DESIGN_MODEL_PROVIDER_NOT_CONFIGURED:modal_triposg" in router
          assert "DESIGN_MODEL_PROVIDER_UNSUPPORTED:" in router
          assert "DESIGN_MODEL_PROVIDER_REQUIRED" in router
          assert '"design_model_provider_router_v1"' in heavy
          assert 'path=="/v1/design-model/generate"' in heavy
          print("DESIGN_MODEL_ROUTER_SOURCE_GUARDS_PASS")
          PY
